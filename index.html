const NAV=[['工作',[['today','今日教学','home'],['schedule','课表与待办','calendar']]],['教学',[['plan','教学计划','list'],['prepare','备课工作室','book'],['bank','题库与组卷','book']]],['学情',[['class','班级与学生','user'],['review','批改与学情','chart'],['wrong','错题与复习','flag']]],['资源',[['dynamic','小学数学动态图','spark'],['relate','知识关联','link'],['report','资源与报告','chart'],['setting','设置与备份','gear']]]];

function migrateGrades(input){
 if(!input||typeof input!=='object'||Array.isArray(input))return input;
 const d={...input},removedResources=['make-ten','para'],removedLessons=['make-ten-lesson','parallelogram'];
 if(removedLessons.includes(d.lessonId))d.lessonId='decimal-2';

 for(const key of ['drafts','notes'])if(d[key]&&typeof d[key]==='object'&&!Array.isArray(d[key]))d[key]=Object.fromEntries(Object.entries(d[key]).filter(([id])=>!removedLessons.includes(id)).map(([id,v])=>[id,key==='drafts'&&Array.isArray(v)?v.filter(r=>!removedResources.includes(r)):v]));

}

function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3000)}
function navHTML(){return NAV.map(([group,items])=>`<details open><summary>${group}</summary>${items.map(([id,title,ico])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(ico)}<span>${title}</span>${id==='dynamic'?`<span class="count">${RESOURCES.length}</span>`:''}</button>`).join('')}</details>`).join('')}
function renderNav(){for(const id of ['desktopNav','mobileNav'])$('#'+id).innerHTML=navHTML();$('#tabs').innerHTML=[['today','今日','home'],['schedule','课表','calendar'],['dynamic','动态图','spark'],['prepare','备课','book'],['setting','设置','gear']].map(([id,t,i])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');$('#topTitle').textContent=PAGES[page];$('#topSub').textContent='三、四年级 · 数学可视化教学';$('#contextChip').textContent=lesson().g+' · '+lesson().u}
const head=(t,s,action='')=>`<div class="page-head"><div><h2>${t}</h2><p>${s}</p></div>${action}</div>`;
const section=(t,action='')=>`<div class="section-head"><h2>${t}</h2>${action}</div>`;
const btn=(t,a,id='',cls='')=>`<button class="btn ${cls}" data-action="${a}" ${id!==''&&id!==undefined?`data-id="${esc(id)}"`:''}>${t}</button>`;
const related=()=>RESOURCES.filter(r=>lesson().resources.includes(r.id));
function previewArt(id,t){return art(id,t).replace(/\sdata-[\w-]+="[^"]*"/g,'').replace(/\stabindex="[^"]*"/g,'').replace(/\srole="button"/g,'').replace('role="group"','role="img"')}
function resourceCard(r){return `<article class="card resource"><div class="art">${previewArt(r.id,.72)}<span class="badge">${r.type}</span></div><div class="info"><h3>${r.title}</h3><p>${r.desc}</p><span class="badge">${r.g} · ${r.u}</span> <span class="badge warm">${r.skill}</span><footer>${btn('打开演示','resource',r.id,'primary')}<div class="actions">${btn('＋ 教案','add',r.id)}<button class="fav" data-action="favorite" data-id="${r.id}" aria-label="${data.favorites.includes(r.id)?'取消收藏':'收藏'}：${r.title}" aria-pressed="${data.favorites.includes(r.id)}">${data.favorites.includes(r.id)?'★':'☆'}</button></div></footer></div></article>`}
function today(){const l=lesson();return head('让每一节课，更直观。',new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date()))+`<div class="hero"><svg class="hero-art" viewBox="0 0 210 170" fill="none" aria-hidden="true"><path d="M25 105 80 20 130 105Z" stroke="#d4e4b6" stroke-width="1.6"/><path d="M91 72h93v72H91z" fill="#ccdca0" fill-opacity=".08" stroke="#ccdfad" stroke-width="1.4"/><circle cx="127" cy="94" r="50" stroke="#dfd39f" stroke-width="1.4"/><path d="M25 132h57M54 104v56" stroke="#e4d6ad" stroke-width="1.5"/><circle cx="80" cy="20" r="3.5" fill="#e4d6ad"/><circle cx="184" cy="144" r="3" fill="#d5e4ba"/><path d="M130 105 184 144M80 20 184 72" stroke="#d1dfbb" stroke-opacity=".3" stroke-dasharray="3 5"/></svg><span class="badge">当前备课 · ${l.g}</span><h2>${l.title}</h2><p>${l.goal}</p><div class="stats"><div><b>${l.resources.length}</b><small>配套交互资源</small></div><div><b>${TODOS.length-data.todos.length}</b><small>未完成待办</small></div><div><b>${(data.drafts[l.id]||[]).length}</b><small>已加入本课教案</small></div></div><div class="actions" style="margin-top:20px">${btn('开始备课 →','prepare','','soft')}${btn('查看配套演示','related')}</div></div><div class="two"><div>${section('快捷入口')}<div class="tiles">${[['dynamic','动态图资源','spark','搜索、收藏与逐步演示'],['bank','题库与组卷','book','本地选题与打印'],['prepare','备课工作室','list','教学笔记与资源收藏'],['wrong','错题与复习','flag','常见错误与解释']].map(([p,t,i,d])=>`<button class="card tile" data-page="${p}">${icon(i)}<h3>${t}</h3><p>${d}</p></button>`).join('')}</div></div><div>${section('备课待办',btn('查看全部','schedule'))}<div class="card">${todoRows()}</div><p class="hint">课表、班级与学情为内置示例；待办勾选及备课修改保存在本机。</p></div></div>${section('本课推荐',btn('全部资源','dynamic'))}<div class="grid">${related().map(resourceCard).join('')}</div>`}
function todoRows(){return TODOS.map(([id,t,d])=>`<label class="row ${data.todos.includes(id)?'done':''}"><input class="check" type="checkbox" data-todo="${id}" ${data.todos.includes(id)?'checked':''}><span class="grow"><h3>${t}</h3><p>${d}</p></span></label>`).join('')}
function schedule(){return head('课表与待办','内置示例周课表，可搜索；待办支持本地完成标记。')+`<div class="toolbar"><label class="search">${icon('search')}<input id="scheduleSearch" type="search" aria-label="搜索课表" placeholder="搜索星期、班级或课题" value="${esc(scheduleKeyword)}"></label></div><div class="card table-wrap" id="scheduleResults">${scheduleRows()}</div>${section('待办事项',btn(data.todos.length===TODOS.length?'全部设为未完成':'全部完成','all-todos'))}<div class="card">${todoRows()}</div>`}
function scheduleRows(){const rows=SCHEDULE.filter(r=>r.join(' ').includes(scheduleKeyword));return `<table><thead><tr><th>星期</th><th>时间</th><th>班级</th><th>课题</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>${!rows.length?'<p class="empty">没有匹配的课节。</p>':''}`}
function plan(){return head('教学计划','示例课时目录 · 点击课时可设为当前备课内容。')+`<div class="card">${LESSONS.map(l=>`<div class="row"><div class="mark">${l.g}</div><div class="grow"><h3>${l.title}</h3><p>${l.resources.length} 个资源 · ${l.steps.length} 个教学环节</p></div>${btn(l.id===data.lessonId?'当前课时':'设为当前','choose-lesson',l.id,l.id===data.lessonId?'soft':'')}</div>`).join('')}</div><p class="notice">本项目只包含上列示例课时与 ${RESOURCES.length} 个资源，不代表某一教材版本的完整目录。</p>`}
function prepare(){const l=lesson(),ids=data.drafts[l.id]||[];return head('备课工作室',l.g+' · '+l.title,btn('打印教案','print'))+`<div class="two"><div><div class="card pad"><span class="badge">教学目标</span><p style="margin-top:12px">${l.goal}</p><div class="timeline">${l.steps.map(([t,d])=>`<div class="step"><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div></div>${section('教学笔记',`<small id="saveState">本机保存</small>`)}<label class="screen-reader" for="notes">当前课时教学笔记</label><textarea id="notes" rows="8" maxlength="30000" placeholder="记录板书设计、提问与课堂反思…">${esc(data.notes[l.id]||'')}</textarea><div class="print-only" style="white-space:pre-wrap">${esc(data.notes[l.id]||'')}</div></div><div>${section('已加入本课教案',btn('添加配套资源','related'))}<div class="card">${ids.length?ids.map(id=>{const r=RESOURCES.find(x=>x.id===id);return `<div class="row"><div class="grow"><h3>${r.title}</h3><p>${r.g} · ${r.u}</p></div>${btn('演示','resource',id)}<button class="btn danger" data-action="remove" data-id="${id}" aria-label="从教案移除${r.title}">移除</button></div>`}).join(''):'<p class="empty">还没有添加资源。<br>打开配套资源后，点击“＋ 教案”。</p>'}</div><p class="hint">刷新后自动恢复。资源只保存关联，不会重复拷贝。</p>${section('课时操作')}<div class="actions">${btn('切换课时','context')}${btn('导出备课文本','export-notes')}</div></div></div>`}
function dynamic(){return head('小学数学动态图','抽象的算理，用看得见的方式解释。',`<span class="badge">${RESOURCES.length} 个内置资源</span>`)+`<div class="toolbar"><label class="search">${icon('search')}<input id="resourceSearch" type="search" value="${esc(filters.keyword)}" placeholder="搜索名称、知识点或说明…" aria-label="搜索资源"></label><button class="btn ${filtersOpen?'soft':''}" data-action="filters" aria-expanded="${filtersOpen}" aria-controls="filterPanel">筛选</button><button class="btn ${filters.favorite?'soft':''}" data-action="favorites" aria-pressed="${filters.favorite}">★ 收藏 ${data.favorites.length}</button>${btn('重置','reset-filter')}</div><div class="chips" aria-label="年级筛选">${['全部','三上','三下','四上','四下'].map(g=>`<button class="chip" data-action="grade" data-id="${g}" aria-pressed="${filters.g===g}">${g}</button>`).join('')}</div><div class="card filters" id="filterPanel" ${filtersOpen?'':'hidden'}>${filterFields()}</div><div id="resourceResults">${resourceResults()}</div>`}
function filterFields(){const units=[...new Set(RESOURCES.filter(r=>filters.g==='全部'||r.g===filters.g).map(r=>r.u))];return [['u','单元 / 知识板块',units],['type','内容类型',[...new Set(RESOURCES.map(r=>r.type))]],['skill','素养指向',[...new Set(RESOURCES.map(r=>r.skill))]]].map(([key,title,values])=>`<label class="field">${title}<select data-filter="${key}">${['全部',...values].map(v=>`<option ${filters[key]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}
function matched(){const k=filters.keyword.trim().toLowerCase();return RESOURCES.filter(r=>(filters.g==='全部'||r.g===filters.g)&&(filters.u==='全部'||r.u===filters.u)&&(filters.type==='全部'||r.type===filters.type)&&(filters.skill==='全部'||r.skill===filters.skill)&&(!filters.favorite||data.favorites.includes(r.id))&&[r.title,r.u,r.desc,r.type,r.skill].join(' ').toLowerCase().includes(k))}
function resourceResults(){const rows=matched();return `<div class="section-head" style="margin-top:4px"><h2>${filters.g==='全部'?'全部年级':filters.g} · ${filters.u==='全部'?'全部单元':filters.u}</h2><span class="muted" role="status">${rows.length} 个匹配资源</span></div><div class="grid">${rows.length?rows.map(resourceCard).join(''):`<div class="card empty"><h3>当前没有匹配资源</h3><p>仅提供三、四年级资源，可以调整单元或清除筛选。</p><br>${btn('查看全部资源','reset-filter')}</div>`}</div>`}
function bank(){const rows=QUESTIONS.filter(q=>questionCategory==='全部'||q.cat===questionCategory);return head('题库与组卷','小数乘法静态示例题库 · 共 6 题',btn('打印已选 '+data.paper.length+' 题','print-paper'))+`<div class="notice">该示例题库固定为“小数乘法”，不随备课课时切换。选择题目后可打印练习卷，答案不会进入打印版。</div><div class="actions no-print">${['全部','基础','变式','拓展'].map(c=>`<button class="chip" data-action="question-category" data-id="${c}" aria-pressed="${questionCategory===c}">${c}</button>`).join('')}${btn('全选题目','select-all')}${btn('清空已选','clear-paper')}</div><div class="print-only"><h2>小数乘法 · 课时练习</h2><p>姓名：____________　班级：____________　日期：____________</p></div>${rows.map(q=>`<article class="question" data-question="${q.id}"><div class="actions no-print"><label><input class="check" type="checkbox" data-question-check="${q.id}" ${data.paper.includes(q.id)?'checked':''}> 加入练习卷</label><span class="badge">${q.cat}</span></div><p>${QUESTIONS.indexOf(q)+1}. ${q.q}</p><details class="no-print"><summary>查看答案与解析</summary><p>${q.a}<br>${q.why}</p></details><div class="print-only" style="height:65px"></div></article>`).join('')}`}
function classPage(){const current=selectedClass==='四(3)班',n=current?42:40;return head('班级与学生','内置班级概况示例，不包含真实学生个人信息。')+`<div class="actions">${['四(3)班','四(1)班'].map(c=>`<button class="chip" data-action="class-select" data-id="${c}" aria-pressed="${selectedClass===c}">${c}</button>`).join('')}<span class="badge warm">示例数据</span></div>${section(selectedClass+' · 班级概况')}<div class="tiles">${[[n,'在班学生'],[current?7:8,'需重点关注'],[current?'86.5':'84.2','单元均分'],[current?'94%':'90%','作业提交率']].map(([v,t])=>`<div class="card pad"><div class="number">${v}</div><p class="muted">${t}</p></div>`).join('')}</div>${section('教学关注')}<div class="card pad"><h3>${current?'小数点定位':'图形旋转对应点'}</h3><p class="muted">${current?'建议使用面积模型解释计数单位，避免只记忆小数位数规则。':'建议先固定旋转中心，再逐个确定对应点的位置。'}</p><div class="actions" style="margin-top:16px">${btn('打开相关演示','resource',current?'area':'rotate','primary')}</div></div>`}
function review(){return head('批改与学情','静态学情示例 · 不提供在线作业收集或自动批改。')+`<div class="card pad"><span class="badge warm">四(3)班 · 示例</span><h3 style="margin-top:15px">共性薄弱点：小数点定位</h3><p class="muted">对“计数单位”的理解不足，容易把整数乘法的结果直接写为小数乘法的积。</p>${[['计算正确率',88],['小数点定位',61]].map(([t,n])=>`<div style="margin-top:22px">${t}<b style="float:right">${n}%</b><div class="progress"><i style="width:${n}%"></i></div></div>`).join('')}${btn('用面积模型重新讲解','resource','area','primary')}</div>${section('批改参考')}<div class="card pad"><p>重点检查：是否正确列式、能否解释积的小数点位置、是否用估算检验结果。</p><p class="hint">这些建议为内置内容，不是对实际学生作业的分析结果。</p></div>`}
function wrong(){return head('错题与复习','从错误答案出发，理解背后的算理。')+`<div class="card">${[['0.25 × 4 = 10','正确结果是 1。25 × 4 = 100，100 个 0.01 是 1。','area'],['1.2 × 0.5 = 6','正确结果是 0.6。乘 0.5 相当于取一半，应小于 1.2。','decimal'],['小数乘法竖式按小数点对齐','小数乘法先按整数乘法计算，末位对齐，再根据计数单位确定积的小数点位置。','decimal']].map(([t,d,id])=>`<details><summary class="row" style="cursor:pointer"><span class="badge warm">错误示例</span><span class="grow">${t}</span><span>＋</span></summary><div class="review-detail"><p>${d}</p><br>${btn('相关演示','resource',id)}</div></details>`).join('')}</div>${section('建议复习安排')}<div class="card pad"><p>第一轮：用图说明算理。第二轮：比较容易混淆的题目。第三轮：在购物等情境中运用。</p><p class="hint">这是静态教学建议，不会自动下发任务或创建提醒。</p>${btn('查看配套题目','bank')}</div>`}
function relate(){const l=lesson();return head('知识关联',l.title+' · 教学内容关系')+`<div class="card pad"><span class="badge warm">当前核心</span><h2 style="margin:12px 0">${l.u}</h2><p>${l.goal}</p><div class="timeline">${l.steps.map(([t,d])=>`<div class="step"><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div></div>${section('关联演示')}<div class="grid">${related().map(resourceCard).join('')}</div>`}
function report(){const total=Object.values(data.drafts).reduce((n,v)=>n+v.length,0);return head('资源与报告','基于本机已保存内容统计，不包含虚构的使用次数。')+`<div class="grid">${[[RESOURCES.length,'内置演示资源'],[data.favorites.length,'已收藏资源'],[total,'教案资源关联']].map(([n,t])=>`<div class="card pad"><b class="number">${n}</b><p>${t}</p></div>`).join('')}</div>${section('已备课课时')}<div class="card">${LESSONS.map(l=>`<div class="row"><div class="grow"><h3>${l.title}</h3><p>${(data.drafts[l.id]||[]).length} 个关联资源 · ${(data.notes[l.id]||'').length} 字笔记</p></div>${btn('打开','open-lesson',l.id)}</div>`).join('')}</div>`}
function setting(){return head('设置与备份','仅开放三、四年级。个人修改可通过 JSON 文件迁移。')+`<div class="card pad"><h3>本地数据</h3><p class="muted" style="margin:10px 0">包含：当前备课课时、收藏、教案资源关联、教学笔记、待办状态、已选题目。</p><p class="badge ${storageOK?'':'warm'}">${storageOK?'本机保存':'保存不可用，请导出备份'}</p><div class="actions" style="margin-top:20px">${btn('导出 JSON 备份','backup','','primary')}${btn('从 JSON 恢复','import')}</div></div>${section('静态项目说明')}<div class="card pad"><p>所有图形、题目、教案示例和样式都内置于此文件。可直接双击打开，也可放入任意静态 Web 服务器。</p><p class="hint">本地文件模式下，不同浏览器或文件路径的存储行为可能不同。跨设备或移动文件前请先导出备份；清理浏览器数据也会删除本机修改。</p><p class="hint">内置 ${RESOURCES.length} 个示例演示，仅提供三上、三下、四上、四下资源与分步练习。没有远程接口、在线批改、云端同步或 MP4 编码功能。</p></div>`}
const views={today,schedule,plan,prepare,bank,class:classPage,review,wrong,dynamic,relate,report,setting};
function render(){renderNav();$('#content').innerHTML=views[page]();}

function updateInteractive(el){const key=el.dataset.interactive,v=Number(el.value);if(!Number.isFinite(v))return;pause();const limits={minutes:[0,1439],year:[1,9999],length:[1,30],width:[1,30],apples:[1,20],plates:[1,6],areaLength:[1,12],areaWidth:[1,8],fractionParts:[2,10],fractionFilled:[0,explore.fractionParts],decimalTenths:[0,10],angleDeg:[0,180],distA:[1,10],distB:[1,10],distC:[1,10],observeCubes:[0,27],lineM:[0,360],lineN:[0,360],lineTM:[-150,150],lineTN:[-150,150],thermoTemp:[-20,40],triAngle:[0,360]};if(!limits[key])return;const value=Math.round(clamp(v,...limits[key]));if(key==='minutes')progress=value/1439;else explore[key]=value;if(key==='fractionFilled')setFractionCount(value);if(key==='fractionParts'){explore.fractionSelected=explore.fractionSelected.filter(i=>i<value);explore.fractionFilled=explore.fractionSelected.length}if(key==='observeCubes')setCubeCount(value);if(['areaLength','areaWidth'].includes(key)){explore.areaCells=null;progress=0}if(['length','width','apples','plates'].includes(key))progress=0;paint()}
function sortMonth(kind){const m=explore.month;if(kind===monthType(m)){if(!explore.sorted.includes(m))explore.sorted.push(m);explore.feedback=explore.sorted.length===12?'全部正确！12个月都完成了分类。':m+'月分类正确！'}else explore.feedback=m===2?'二月是特殊月，既不是大月也不是小月。':'再想想：'+m+'月有'+daysOfMonth(m,explore.year)+'天。';refreshExtra()}

function interactiveCaption(id,t){
 if(id==='clock24'){const min=Math.round(t*1439),h=Math.floor(min/60),m=String(min%60).padStart(2,'0');return `${String(h).padStart(2,'0')}:${m} 对应${h<6?'凌晨':h<12?'上午':h===12?'中午':h<18?'下午':'晚上'}${h%12||12}时${m}分；一天24小时，时针走两圈。`}

 if(id==='perimeter'){const w=explore.shape==='rect'?explore.width:explore.length;return `周长＝${explore.shape==='rect'?`（${explore.length}＋${w}）×2`:`${w}×4`}＝${2*(explore.length+w)}厘米。`}

 if(id==='area-rectangle'){const g=areaLayout();return `已铺${areaSelection(t).size}/${g.total}个单位方格；面积＝${g.cols}×${g.rows}＝${g.total}平方格。`}
 if(id==='fraction-intro')return `整体平均分成${explore.fractionParts}份，取${explore.fractionFilled}份，表示 ${explore.fractionFilled}/${explore.fractionParts}。`;
 if(id==='symmetry-butterfly'||id==='fold')return t>=1?'沿对称轴折叠后，两边完全重合。':'拖动彩色半边，沿对称轴折叠并观察对应部分。';

document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelCanvasDrag();if(e.key!=='Enter'&&e.key!==' ')return;const target=e.target.closest('svg [data-action]');if(target&&$('#playerCanvas').contains(target)&&actions[target.dataset.action]){e.preventDefault();actions[target.dataset.action](target)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelCanvasDrag();pause()}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==page)navigate(p,false)});
try{const raw=localStorage.getItem(STORAGE);if(raw){const parsed=migrateGrades(JSON.parse(raw));if(!validData(parsed))throw new Error('invalid');data=normalize(parsed);localStorage.setItem(STORAGE,JSON.stringify(data))}}catch(e){loadWarning='本机数据无法读取，已使用默认视图。可从 JSON 备份恢复。'}
navigate(location.hash.slice(1)||'today',false);if(loadWarning)toast(loadWarning);
</script>
</body>
</html>
